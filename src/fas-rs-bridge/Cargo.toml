[package]
name = "pixel-fas-rs-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["analyzer"]
analyzer = ["dep:frame-analyzer", "dep:ctrlc"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
log = "0.4"
likely_stable = "0.1.3"
parking_lot = "0.12"
nix = { version = "0.30", features = ["sched"] }
num_cpus = "1.17"
serde_json = "1.0"
frame-analyzer = { path = "upstream/frame-analyzer/frame-analyzer", optional = true }
ctrlc = { version = "3.4", features = ["termination"], optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
